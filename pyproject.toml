[project]
name = "modele-apprenant"
version = "0.1.0"
description = "Modèle intelligent, dynamique et explicable de l'apprenant en compréhension écrite au primaire"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Recherche en adaptation pédagogique"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
